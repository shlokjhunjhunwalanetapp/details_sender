name: Telegram Command Sync
# This workflow is DISABLED once the Cloudflare Worker webhook is set up.
# The worker handles commands instantly without polling.
# Re-enable by restoring the schedule trigger below if you remove the webhook.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "2-59/5 * * * *"

jobs:
  sync-commands:
    runs-on: ubuntu-latest
    environment: TELEGRAM_BOT_TOKEN
    concurrency:
      group: stock-bot-state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --commands-only

      - name: Persist command state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/request_budget.json
          git diff --staged --quiet || git commit -m "chore: sync telegram state"
          git pull --rebase origin main
          git push
