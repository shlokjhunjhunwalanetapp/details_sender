name: Scheduled Stock Run

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: TELEGRAM_BOT_TOKEN
    concurrency:
      group: stock-bot-state
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_NEWS_PER_STOCK: "6"
          NEWS_RECENT_HOURS: "24"
          MARKET_OPEN: "09:15"
          MARKET_CLOSE: "15:30"
        run: python -m src.main

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/request_budget.json
          git diff --staged --quiet || git commit -m "chore: persist bot state"
          git pull --rebase origin main
          git push
