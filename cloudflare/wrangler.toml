name = "stock-news-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Non-secret vars — change GITHUB_REPO to your actual repo
[vars]
GITHUB_REPO = "shlokjhunjhunwalanetapp/all_stock_details_sender"

# Secrets are NOT stored here — set them with:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put TELEGRAM_SECRET_TOKEN
#   wrangler secret put GITHUB_TOKEN
